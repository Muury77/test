const BANK = [{"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "open", "question": "Kto jest autorem eposów “Iliada” i “Odyseja”, najstarszych przekazów greckiej myśli ekonomicznej?", "options": [], "answer": "Homer"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "open", "question": "Kto w eposie dydaktycznym “Prace i dnie” głosił pochwałę pracy w haśle “praca nie hańbi, hańbi próżnowanie”?", "options": [], "answer": "Hezjod"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "open", "question": "Jaki tytuł nosi dzieło Ksenofonta, które jest pierwszym traktatem, gdzie używa się nazwy przyjętej w XVI wieku na określenie nauki o gospodarowaniu?", "options": [], "answer": "“Ekonomik”"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "tf", "question": "Platon przedstawił rozwiniętą koncepcję budowy lepszego ustroju w rozprawie “Rzeczpospolita”.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "tf", "question": "Istotny wpływ na rozwój myśli ekonomicznej wywiera instytucja państwa rzymskiego, co wynika z faktu, że Rzym stał się stolicą ogromnego imperium kierującego licznymi prowincjami.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "tf", "question": "Eksploatacja niewolników wg Warrona nie powinna się opierać na bezpośrednim przymusie i bodźcach naturalnych.", "options": [], "answer": "Fałsz (powinna opierać się na bezpośrednim przymusie oraz na bodźcach naturalnych)", "correct": "false"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "mc", "question": "W miarę utrwalania się potęgi Rzymu następował rozwój wielkich posiadłości ziemskich, nazywanych:", "options": [{"letter": "a", "text": "latyfundiami,"}, {"letter": "b", "text": "kolonatem,"}, {"letter": "c", "text": "gospodarstwami,"}, {"letter": "d", "text": "gruntami."}], "answer": "a) latyfundiami", "correct": "a"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "mc", "question": "Katon - wzór rzymskich cnót i surowości, wybitny mąż stanu republiki, wsławił się jednym z pierwszych na świecie traktatów poświęconych:", "options": [{"letter": "a", "text": "handlowi,"}, {"letter": "b", "text": "reformom,"}, {"letter": "c", "text": "ekonomice rolnictwa,"}, {"letter": "d", "text": "gruntom społecznym."}], "answer": "c) ekonomice rolnictwa", "correct": "c"}, {"chapter": "2. Myśl ekonomiczna niewolnictwa", "type": "mc", "question": "W starożytnym Rzymie ogromny wpływ na kształtowanie stosunków społecznych, gospodarczych i politycznych miały ______. Dzięki nim zapewniano dopływ niewolników i łupów.", "options": [{"letter": "a", "text": "klęski żywiołowe,"}, {"letter": "b", "text": "wojny,"}, {"letter": "c", "text": "reformy agrarne,"}, {"letter": "d", "text": "wszystkie odpowiedzi są poprawne."}], "answer": "b) wojny", "correct": "b"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "open", "question": "Etyka chrześcijańska była fundamentem myśli ekonomicznej feudalizmu. Ideologia __________ regulowała życie gospodarcze, nadając mu wymiar moralny.", "options": [], "answer": "Kościoła"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "open", "question": "Szczytowym osiągnięciem myśli kanonistycznej w dziedzinie ekonomii jest teoria ceny _______________ zaprezentowana przez Tomasza z Akwinu.", "options": [], "answer": "Sprawiedliwej"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "open", "question": "W naukach Alberta Wielkiego i Tomasza z Akwinu ___________ występuje jako wyraz umowy społecznej, środek ułatwiający wymianę, o wartości wynikającej z samej umowy i sygnowanej przez wybity znak władcy, oraz jako towar ułatwiający wymianę przez swą skondensowaną wartość kruszcu użytego do jego wybicia.", "options": [], "answer": "Pieniądz"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "tf", "question": "W systemie feudalnym państwo miało ograniczoną rolę w zarządzaniu gospodarką. Państwo koncentrowało się na zapewnianiu porządku i ochrony w ramach systemu feudalnego.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "tf", "question": "Myśl ekonomiczna feudalizmu zawarta na indywidualnym zysku, wolnym rynku i prywatnej własności.", "options": [], "answer": "Fałsz", "correct": "false"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "tf", "question": "Struktura ceny sprawiedliwej według Tomasza z Akwinu uwzględnia wartość pracy, nakładów rzeczowych i dodatkowych usług, w rodzaju transportowania i składowania.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "mc", "question": "Która z poniższych postaci była najbardziej związana z myślą ekonomiczną feudalizmu?", "options": [{"letter": "a", "text": "John Locke"}, {"letter": "b", "text": "Adam Smith"}, {"letter": "c", "text": "Tomasz z Akwinu"}, {"letter": "d", "text": "Karl Marx"}], "answer": "c) Tomasz z Akwinu", "correct": "c"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "mc", "question": "Co było głównym przedmiotem transakcji w ramach gospodarki feudalnej?", "options": [{"letter": "a", "text": "Przemysłowe towary"}, {"letter": "b", "text": "Ziemia i jej użytkowanie"}, {"letter": "c", "text": "Pieniądze"}, {"letter": "d", "text": "Prace rzemieślnicze i artystyczne"}], "answer": "b) Ziemia i jej użytkowanie", "correct": "b"}, {"chapter": "3. Myśl ekonomiczna feudalizmu", "type": "mc", "question": "Która z poniższych teorii nie należe do systemu poglądów ekonomicznych Tomasza z Akwinu?", "options": [{"letter": "a", "text": "Teoria ceny sprawiedliwej"}, {"letter": "b", "text": "Teoria zysku kupieckiego"}, {"letter": "c", "text": "Teoria pieniądza"}, {"letter": "d", "text": "Teoria wytwarzania bogactwa"}], "answer": "d) Teoria wytwarzania bogactwa.", "correct": "d"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "open", "question": "Gwałtowny rozwój handlu światowego, otwarcie nowych chłonnych rynków zagranicznych i coraz szybszy wzrost popytu na rynkach wewnętrznych (narodowych) sprzyjały rozwojowi ______ .", "options": [], "answer": "kapitału handlowego"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "open", "question": "Jak nazywała się wyspa, którą opisywał Thomas Morus, obecnie będąca synonimem rzeczy i spraw idealnych, ale nierealnych?", "options": [], "answer": "Utopia"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "open", "question": "Autorem dzieła “O naprawie Rzeczypospolitej”, zawierającego cenne poglądy ekonomiczne: pochwałę pracowitości i potrzeby zatrudnienia wszystkich rąk do pracy jest ____.", "options": [], "answer": "Andrzej Frycz Modrzewski"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "tf", "question": "W epoce Oświecenia istotne znaczenie ma fakt rozwoju nauk przyrodniczych i degradacja scholastyki w jej wydaniu średniowiecznym, czego przykładem jest podważenie przez Kopernika tradycyjnej kosmologii i astronomii.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "tf", "question": "Monetaryzm rozwijał się szczególnie w tych krajach, w których stosunki towarowo-pieniężne upowszechniły się szeroko - w Anglii, Francji, Hiszpanii i we Włoszech.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "tf", "question": "Mikołaj Kopernik sformułował prawo wypierania z obiegu dobrego pieniądza przez gorszy.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "mc", "question": "Autorami utopii społecznych są:", "options": [{"letter": "a", "text": "Thomas Morus, Tomasz Campanella,"}, {"letter": "b", "text": "Mikołaj Kopernik, Thomas Morus,"}, {"letter": "c", "text": "Tomasz Munzerow, Antonio Serra"}, {"letter": "d", "text": "żaden z wymienionych."}], "answer": "a)Thomas Morus, Tomasz Campanella", "correct": "a"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "mc", "question": "W epoce Odrodzenia powstały takie traktaty jak “Książę” Machiavellego i “O naprawie Rzeczypospolitej” Frycza Modrzewskiego, które wywarły duży wpływ na myśl:", "options": [{"letter": "a", "text": "techniczną,"}, {"letter": "b", "text": "społeczną,"}, {"letter": "c", "text": "polityczną,"}, {"letter": "d", "text": "utopijną."}], "answer": "c) polityczną", "correct": "c"}, {"chapter": "4. Merkantylizm i myśl ekonomiczna Odrodzenia", "type": "mc", "question": "Wielki filozof i mąż stanu Francis Bacon był propagatorem zorganizowanych badań eksperymentalnych, głosił empiryzm i utylitaryzm. W rozprawie “Nowa Atlantyda” najbardziej uwidoczniło się jego przekonanie o:", "options": [{"letter": "a", "text": "znaczeniu etyki,"}, {"letter": "b", "text": "racjonalnym zorganizowaniu stosunków produkcji,"}, {"letter": "c", "text": "potędze nauki i postępu technologicznego,"}, {"letter": "d", "text": "znaczeniu kolektywnej pracy."}], "answer": "c) potędze nauki i postępu technologicznego", "correct": "c"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "open", "question": "William Petty wprowadził teorię czynników produkcji, zgodnie z którą „ojcem bogactwa jest __________ , a matką ziemia”.", "options": [], "answer": "praca"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "open", "question": "Nicolas Barbon uznawał, że wartość towarów pochodzi z ich _________ , a rynek pełni rolę miary wartości.", "options": [], "answer": "przydatności"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "open", "question": "David Hume był twórcą rozwiniętej teorii ilościowej pieniądza oraz teorii bilansu _______.", "options": [], "answer": "płatniczego"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "tf", "question": "Pierre le Pesant Sieur de Boisguilbert uważał, że pieniądz jest najważniejszym bogactwem narodowym.", "options": [], "answer": "Fałsz", "correct": "false"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "tf", "question": "Stanisław Garczyński krytykował system gospodarczy Polski oparty na pańszczyźnie.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "5. Prekursorzy szkoły klasycznej", "type": "tf", "question": "James Steuart wprowadził metodę historyczną do analizy procesów gospodarczych.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "6. Fizjokratyzm", "type": "open", "question": "Gmach społeczności ludzkich (gmach porządku społecznego) według Quesnaya opiera się na trzech prawach natury i wolnościach człowieka: własności prywatnej, wolności gospodarczej oraz ________ .", "options": [], "answer": "wolności osobistej"}, {"chapter": "6. Fizjokratyzm", "type": "open", "question": "W ___________, Quesnay przedstawił reprodukcję i cyrkulację kapitału społecznego. Wzniósł się ponad rozpatrywanie indywidualnych aktów cyrkulacji i dostrzegł strumienie przepływów między trzema klasami społecznymi. Przyjął tu trzy założenia: stałość cen, odzwierciedlającą porządek naturalny, tj. ekwiwalentną wymianę towarów; reprodukcję prostą; brak rynku zewnętrznego.", "options": [], "answer": "Tablicy Ekonomicznej"}, {"chapter": "6. Fizjokratyzm", "type": "tf", "question": "Metodologia porządku naturalnego stanowiła najbliższe otoczenie systemu ekonomicznego fizjokratów.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "6. Fizjokratyzm", "type": "tf", "question": "Według Turgota nierówność majątkowa jest rezultatem nierówności uzdolnień i umiejętności ich wykorzystania.", "options": [], "answer": "Prawda", "correct": "true"}, {"chapter": "6. Fizjokratyzm", "type": "tf", "question": "Quesnay podzielił społeczeństwo na trzy klasy: klasę właścicieli, klasę produkcyjną oraz kapitalistów.", "options": [], "answer": "Fałsz (klasa właścicieli, klasa produkcyjna oraz klasa jałowa)", "correct": "false"}, {"chapter": "6. Fizjokratyzm", "type": "mc", "question": "Rzeczywisty lub możliwy stan, który pochodzi od ludzi i wynika z praktycznych potrzeb ludzkości to:", "options": [{"letter": "a", "text": "porządek naturalny,"}, {"letter": "b", "text": "porządek pozytywny,"}, {"letter": "c", "text": "porządek doskonały,"}, {"letter": "d", "text": "wolność osobista."}], "answer": "b) porządek pozytywny", "correct": "b"}, {"chapter": "6. Fizjokratyzm", "type": "mc", "question": "Fizjokratyczny postulat „jedynego podatku” wynikał z przekonania, że źródłem bogactwa jest:", "options": [{"letter": "a", "text": "rolnictwo,"}, {"letter": "b", "text": "przemysł,"}, {"letter": "c", "text": "handel,"}, {"letter": "d", "text": "praca."}], "answer": "a) rolnictwo", "correct": "a"}, {"chapter": "6. Fizjokratyzm", "type": "mc", "question": "Według fizjokratów, jedynie w rolnictwie dochodzi do procesu pomnażania bogactwa, ponieważ ziemia umożliwia wytwarzanie tzw. produktu czystego, czyli:", "options": [{"letter": "a", "text": "dochodu z uzyskanych ze sprzedaży plonów,"}, {"letter": "b", "text": "nakładów większych niż nadwyżek,"}, {"letter": "c", "text": "nadwyżki ponad wyłożone nakłady,"}, {"letter": "d", "text": "takiego samego poziomu nadwyżki i wyłożonych nakładów."}], "answer": "c) nadwyżki ponad wyłożone nakłady", "correct": "c"}, {"chapter": "7. System ekonomiczny Adama Smitha", "type": "open", "question": "Podstawowe dzieło Adama Smitha to “Badania nad naturą i przyczynami __________ narodów”", "options": [], "answer": "bogactwa"}, {"chapter": "7. System ekonomiczny Adama Smitha", "type": "open", "question": "Teoria _________ gruntowej - według Adama Smitha “rozumiana jest jako cena, którą płaci się za użytkowanie ziemi i jest z natury ceną monopolową”.", "options": [], "answer": "renty"}, {"chapter": "7. System ekonomiczny Adama Smitha", "type": "open", "question": "Według Adama Smitha “płaca, _________ i renta to trzy pierwotne źródła wszelk function update(){ $('counter').textContent=idx<deck.length?`Pytanie ${idx+1} z ${deck.length}`:'Koniec quizu';$('score').textContent=`Poprawne: ${correct}/${graded} · otwarte: ${openCount}`;$('bar').style.width=(idx/deck.length*100)+'%';}
function reveal(isCorrect,answer,chosen){if(answered)return;answered=true;const f=$('feedback');f.className='feedback '+(isCorrect===null?'':isCorrect?'ok':'no');f.textContent=(isCorrect===null?'Odpowiedź wzorcowa: ':isCorrect?'Dobrze! Poprawna odpowiedź: ':'Niepoprawnie. Poprawna odpowiedź: ')+answer;$('next').classList.remove('hidden');$('next').focus();if(isCorrect!==null){graded++;if(isCorrect)correct++;}else openCount++;update();}
function show(){answered=false;update();$('feedback').className='feedback hidden';$('next').className='primary hidden';$('choices').replaceChildren();if(idx>=deck.length){$('bar').style.width='100%';$('chapter').textContent='Podsumowanie';$('question').textContent=`Wynik: ${correct}/${graded} poprawnych odpowiedzi zamkniętych. Pytania otwarte: ${openCount} (samodzielna ocena).`;$('next').textContent='Rozpocznij ponownie';$('next').classList.remove('hidden');$('next').onclick=()=>{deck=shuffle(BANK);idx=correct=graded=openCount=0;$('next').textContent='Następne pytanie';$('next').onclick=advance;show();};return;}
const q=deck[idx];$('chapter').textContent=q.chapter;$('question').textContent=q.question;const box=$('choices');
if(q.type==='open'){let input=el('input');input.placeholder='Wpisz odpowiedź (opcjonalnie)';input.setAttribute('aria-label','Twoja odpowiedź');box.append(input);let b=el('button','primary','Pokaż odpowiedź');b.onclick=()=>{input.disabled=true;b.disabled=true;reveal(null,q.answer)};box.append(b);}
else{let opts=q.type==='tf'?[{text:'Prawda',letter:'true'},{text:'Fałsz',letter:'false'}]:shuffle(q.options);for(const o of opts){const b=el('button','choice',o.text);b.onclick=()=>{if(answered)return;const ok=o.letter===q.correct;for(const x of box.children){x.disabled=true;if(x.dataset.key===q.correct)x.classList.add('good');if(x===b&&!ok)x.classList.add('bad');}reveal(ok,q.type==='tf'?(q.correct==='true'?'Prawda':'Fałsz'):(q.options.find(v=>v.letter===q.correct)?.text||q.answer));};b.dataset.key=o.letter;box.append(b);}}
}
function advance(){idx++;show()}$('next').onclick=advance;show();
</script></body></html>
